name: pre-commit

# PRs only on feature branches — avoids duplicate push+PR runs (saves Actions minutes).
# Maintainers: run `python3 -m pre_commit run --all-files` locally before every push.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run hooks on all files
        run: pre-commit run --all-files --show-diff-on-failure
