version: '3.8'

# God Project — Local Development Stack
# All services run locally. No real money. No mainnet.
# See docs/37-local-development-environment.md for setup instructions.

services:

  # ─── IPFS Private Network (3 nodes) ──────────────────────────────────

  ipfs-node-1:
    image: ipfs/kubo:v0.28.0
    container_name: god-ipfs-1
    environment:
      - IPFS_SWARM_KEY_FILE=/data/ipfs/swarm.key
      - IPFS_PROFILE=server
    volumes:
      - ipfs1_data:/data/ipfs
      - ./swarm.key:/data/ipfs/swarm.key:ro
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "5001:5001"
      - "8080:8080"
    networks:
      - god-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  ipfs-node-2:
    image: ipfs/kubo:v0.28.0
    container_name: god-ipfs-2
    environment:
      - IPFS_SWARM_KEY_FILE=/data/ipfs/swarm.key
      - IPFS_PROFILE=server
    volumes:
      - ipfs2_data:/data/ipfs
      - ./swarm.key:/data/ipfs/swarm.key:ro
    ports:
      - "4002:4001"
      - "4002:4001/udp"
      - "5002:5001"
      - "8081:8080"
    networks:
      - god-net
    restart: unless-stopped

  ipfs-node-3:
    image: ipfs/kubo:v0.28.0
    container_name: god-ipfs-3
    environment:
      - IPFS_SWARM_KEY_FILE=/data/ipfs/swarm.key
      - IPFS_PROFILE=server
    volumes:
      - ipfs3_data:/data/ipfs
      - ./swarm.key:/data/ipfs/swarm.key:ro
    ports:
      - "4003:4001"
      - "4003:4001/udp"
      - "5003:5001"
      - "8082:8080"
    networks:
      - god-net
    restart: unless-stopped

  # ─── Blockchain: Anvil (Base Sepolia fork) ────────────────────────────

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: god-anvil
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
      - "--block-time"
      - "3"
      - "--accounts"
      - "30"
      - "--balance"
      - "10000"
      - "--chain-id"
      - "84532"
      - "--state-interval"
      - "30"
      - "--dump-state"
      - "/data/anvil-state.json"
    volumes:
      - anvil_data:/data
    ports:
      - "8545:8545"
    networks:
      - god-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Event Bus: NATS with JetStream ──────────────────────────────────

  nats:
    image: nats:2.10-alpine
    container_name: god-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - nats_data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - god-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── State Persistence: Redis (LangGraph checkpointer) ───────────────

  redis:
    image: redis:7-alpine
    container_name: god-redis
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - god-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Event Log & Registry: PostgreSQL ────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: god-postgres
    environment:
      POSTGRES_DB: god_world
      POSTGRES_USER: god
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - god-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U god -d god_world"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Agent Runtime (Python + LangGraph) ──────────────────────────────

  runtime:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    container_name: god-runtime
    environment:
      - IPFS_API=http://ipfs-node-1:5001
      - IPFS_GATEWAY=http://ipfs-node-1:8080
      - ANVIL_RPC=http://anvil:8545
      - CHAIN_ID=84532
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://god:${POSTGRES_PASSWORD:-localdev}@postgres:5432/god_world
      - WORLD_ID=local-dev-world-1
      - LOG_LEVEL=DEBUG
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./runtime/src:/app/src
      - ./runtime/agents:/app/agents
    ports:
      - "8888:8888"
    networks:
      - god-net
    depends_on:
      ipfs-node-1:
        condition: service_healthy
      anvil:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─── Observer Website (Next.js dev server) ───────────────────────────

  observer:
    build:
      context: ./observer
      dockerfile: Dockerfile
      target: development
    container_name: god-observer
    environment:
      - NEXT_PUBLIC_RUNTIME_URL=http://localhost:8888
      - NEXT_PUBLIC_NATS_WS_URL=ws://localhost:4222
      - NEXT_PUBLIC_IPFS_GATEWAY=http://localhost:8080
      - NEXT_PUBLIC_CHAIN_ID=84532
    volumes:
      - ./observer/src:/app/src
      - ./observer/public:/app/public
    ports:
      - "3000:3000"
    networks:
      - god-net
    depends_on:
      - runtime
      - nats
    restart: unless-stopped

# ─── Networks ─────────────────────────────────────────────────────────────

networks:
  god-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─── Volumes ──────────────────────────────────────────────────────────────

volumes:
  ipfs1_data:
  ipfs2_data:
  ipfs3_data:
  anvil_data:
  nats_data:
  redis_data:
  postgres_data:
